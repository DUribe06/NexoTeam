org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Dirección pública de la API, con https y terminada en /. La de relleno impide generar una versión para publicar.
nexoApiUrl=https://api.nexo.invalid/
# ID del cliente OAuth tipo Web de Google Cloud (es público, no es un secreto). Es el mismo NEXO_GOOGLE_CLIENT_ID del servidor.
nexoGoogleClientId=
