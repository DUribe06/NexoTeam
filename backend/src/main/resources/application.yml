spring:
  application:
    name: nexo-backend
  datasource:
    url: ${NEXO_DB_URL:jdbc:postgresql://localhost:5432/nexo}
    username: ${NEXO_DB_USUARIO:nexo}
    password: ${NEXO_DB_CLAVE:}
  jpa:
    hibernate:
      # El esquema lo gestiona Flyway; Hibernate solo lo valida
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

nexo:
  correo:
    # consola: escribe el código en el log (solo desarrollo). Aún no hay envío real.
    modo: consola
    # Consulta DNS (registro MX) para comprobar que el dominio recibe correo
    verificar-mx: true
  jwt:
    # Obligatorio: mínimo 32 caracteres, desde la variable de entorno NEXO_JWT_SECRETO. No hay valor por defecto a propósito.
    secreto: ${NEXO_JWT_SECRETO}
  login:
    maximo-intentos: 5
    minutos-de-bloqueo: 15
