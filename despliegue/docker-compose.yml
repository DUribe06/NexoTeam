# Nexo en un solo servidor: API, PostgreSQL y HTTPS. Pasos completos en backend/docs/despliegue.md.
# Solo Caddy abre puertos: la API y la base únicamente se ven entre ellas.
x-registros: &registros
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  base:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${NEXO_DB_CLAVE:?Falta NEXO_DB_CLAVE en .env}
      # La misma collation de la integración continua, para que el orden de los textos no cambie
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    volumes:
      - base:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 10s
      timeout: 5s
      retries: 12
    <<: *registros

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      base:
        condition: service_healthy
    environment:
      NEXO_DB_URL: jdbc:postgresql://base:5432/nexo
      NEXO_DB_USUARIO: nexo
      NEXO_DB_CLAVE: ${NEXO_DB_CLAVE:?Falta NEXO_DB_CLAVE en .env}
      NEXO_JWT_SECRETO: ${NEXO_JWT_SECRETO:?Falta NEXO_JWT_SECRETO en .env}
      NEXO_ADMIN_CORREO: ${NEXO_ADMIN_CORREO:?Falta NEXO_ADMIN_CORREO en .env}
      NEXO_ADMIN_CONTRASENA: ${NEXO_ADMIN_CONTRASENA:?Falta NEXO_ADMIN_CONTRASENA en .env}
      NEXO_SMTP_HOST: ${NEXO_SMTP_HOST:?Falta NEXO_SMTP_HOST en .env}
      NEXO_SMTP_PUERTO: ${NEXO_SMTP_PUERTO:-587}
      NEXO_SMTP_USUARIO: ${NEXO_SMTP_USUARIO:?Falta NEXO_SMTP_USUARIO en .env}
      NEXO_SMTP_CLAVE: ${NEXO_SMTP_CLAVE:?Falta NEXO_SMTP_CLAVE en .env}
      NEXO_CORREO_REMITENTE: ${NEXO_CORREO_REMITENTE:?Falta NEXO_CORREO_REMITENTE en .env}
      NEXO_GOOGLE_CLIENT_ID: ${NEXO_GOOGLE_CLIENT_ID:?Falta NEXO_GOOGLE_CLIENT_ID en .env}
      # Memoria reservada desde el arranque: sin saltos por recolección, y por encima del 20 % que Oracle considera inactivo
      JAVA_TOOL_OPTIONS: -Xms1500m -Xmx1500m -XX:+AlwaysPreTouch
    <<: *registros

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NEXO_DOMINIO: ${NEXO_DOMINIO:?Falta NEXO_DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    <<: *registros

volumes:
  base:
  caddy_datos:
  caddy_config:
